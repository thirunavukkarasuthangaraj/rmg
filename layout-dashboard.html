<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Dashboard — Kannapalayam | RMG Enterprisses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F8;
    --panel:#FFFFFF;
    --ink:#2C3E50;
    --ink-soft:#5A6B7B;
    --muted:#8A99A8;
    --line:#E3E9EF;
    --line-strong:#CDD7E0;
    /* zone palette */
    --reg:#FFFFFF;       --reg-bd:#C9D4DE;
    --ews:#E4F0FB;       --ews-bd:#93BEE3;
    --park:#DCF3E4;      --park-bd:#8FD3A6;
    --shop:#FCE4C9;      --shop-bd:#EDAE6B;
    --public:#FFF1C4;    --public-bd:#E9C459;
    /* status */
    --avail:#2ECC71;
    --reserved:#F2A413;
    --sold:#B6C0C9;
    --accent:#0E7C66;
    --gold:#C9A24B;
    --shadow:0 18px 40px -22px rgba(20,40,55,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(900px 500px at 90% -10%, #e9f6f1 0%, transparent 55%),
      radial-gradient(700px 500px at -5% 110%, #eaf1f8 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1500px;margin:0 auto;padding:22px clamp(14px,3vw,34px) 40px}

  /* ---------- top brand bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .logo{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(150deg,#0E7C66,#0a5c4c);color:#FFE6A3;font-family:"Sora";font-weight:800;font-size:1.45rem;
    box-shadow:0 10px 22px -10px rgba(14,124,102,.7)}
  .brand h1{font-family:"Sora";font-size:1.18rem;font-weight:800;letter-spacing:-.02em}
  .brand p{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .crumbs{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--ink-soft);font-weight:600}
  .pill{padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px -8px rgba(20,40,55,.3)}
  .pill b{color:var(--accent)}

  /* ---------- split screen ---------- */
  .board{display:grid;grid-template-columns:60% 40%;gap:18px;align-items:stretch}
  @media(max-width:980px){.board{grid-template-columns:1fr}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}

  /* ---------- map panel ---------- */
  .map-panel{display:flex;flex-direction:column;min-height:560px}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#fbfcfd)}
  .tool-group{display:flex;align-items:center;gap:8px}
  .tool-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;margin-right:2px}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);
    font:inherit;font-weight:700;font-size:.85rem;padding:8px 13px;border-radius:11px;cursor:pointer;
    transition:.16s ease;line-height:1}
  .btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(14,124,102,.6)}
  .btn:active{transform:translateY(0)}
  .btn.icon{padding:8px 11px;font-size:1rem}
  .seg{display:inline-flex;background:#eef2f6;border:1px solid var(--line);border-radius:11px;padding:3px}
  .seg button{border:0;background:transparent;font:inherit;font-weight:700;font-size:.82rem;color:var(--ink-soft);
    padding:7px 14px;border-radius:8px;cursor:pointer;transition:.16s}
  .seg button.active{background:#fff;color:var(--accent);box-shadow:0 4px 10px -6px rgba(20,40,55,.4)}

  .map-stage{position:relative;flex:1;background:
      linear-gradient(0deg,#f7fafc,#fdfefe);
    background-size:26px 26px;overflow:hidden}
  .map-stage::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(#eef3f7 1px,transparent 1px),linear-gradient(90deg,#eef3f7 1px,transparent 1px);
    background-size:26px 26px;opacity:.6;pointer-events:none}
  svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;position:relative}
  svg#map.grabbing{cursor:grabbing}

  /* plots */
  .plot{fill:var(--reg);stroke:var(--reg-bd);stroke-width:1.3;cursor:pointer;
    transition:transform .14s ease, filter .14s ease, fill .14s ease;transform-box:fill-box;transform-origin:center}
  .plot.ews{fill:var(--ews);stroke:var(--ews-bd)}
  .plot.st-available{stroke:var(--avail);stroke-width:1.6}
  .plot.st-reserved{stroke:var(--reserved);stroke-width:1.6}
  .plot.st-sold{fill:#EEF1F4;stroke:var(--sold)}
  .plot.ews.st-sold{fill:#DDE7F0}
  .plot:hover{stroke:var(--ink);stroke-width:2.2;transform:scale(1.16);
    filter:drop-shadow(0 3px 6px rgba(20,40,55,.3))}
  .plot.selected{stroke:var(--ink);stroke-width:2.6;fill:#FFE3A0;transform:scale(1.16);
    filter:drop-shadow(0 4px 8px rgba(20,40,55,.4))}
  /* filter: dim non-available */
  svg#map.only-avail .plot.st-sold,
  svg#map.only-avail .plot.st-reserved{opacity:.12;pointer-events:none}

  .zone{cursor:pointer;transition:filter .14s, transform .14s;transform-box:fill-box;transform-origin:center}
  .zone:hover{filter:brightness(.96)}
  .zone.park{fill:var(--park);stroke:var(--park-bd)}
  .zone.shop{fill:var(--shop);stroke:var(--shop-bd)}
  .zone.public{fill:var(--public);stroke:var(--public-bd)}
  .zone.selected{stroke:var(--ink);stroke-width:3}
  .road{fill:#E9EEF2}
  .road-line{stroke:#C3CCD5;stroke-width:2;stroke-dasharray:11 11;fill:none;stroke-linecap:round}
  .lbl{font-family:"Plus Jakarta Sans";font-weight:700;fill:#7C8B99;pointer-events:none;text-transform:uppercase;letter-spacing:.1em}
  .zlbl{font-family:"Plus Jakarta Sans";font-weight:700;pointer-events:none;text-anchor:middle}
  .tree{fill:#9FD3A6;opacity:.9}
  .compass{pointer-events:none}

  /* tooltip */
  .tip{position:absolute;pointer-events:none;z-index:30;background:var(--ink);color:#fff;
    padding:7px 11px;border-radius:9px;font-size:.78rem;font-weight:600;white-space:nowrap;
    transform:translate(-50%,-130%);opacity:0;transition:opacity .12s;box-shadow:0 10px 22px -10px rgba(0,0,0,.6)}
  .tip.show{opacity:1}
  .tip b{color:#FFE3A0}
  .tip::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:var(--ink)}

  /* legend chip strip on map */
  .map-legend{display:flex;gap:14px;flex-wrap:wrap;padding:11px 16px;border-top:1px solid var(--line);background:#fff}
  .lg{display:flex;align-items:center;gap:7px;font-size:.76rem;font-weight:700;color:var(--ink-soft)}
  .sw{width:15px;height:15px;border-radius:4px;border:1.6px solid}

  /* ---------- sidebar ---------- */
  .side{display:flex;flex-direction:column}
  .side-pad{padding:22px}
  .side-head{padding:20px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,#0E7C66,#0a5246);color:#fff}
  .side-head .ey{font-size:.72rem;text-transform:uppercase;letter-spacing:.16em;color:#bfe9dc;font-weight:700}
  .side-head h2{font-family:"Sora";font-size:1.32rem;font-weight:800;margin-top:3px}
  .side-head .loc{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:.85rem;color:#d6f2ea;font-weight:600}
  .side-head .loc svg{width:15px;height:15px}

  /* stat cards */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:18px}
  .stat{border:1px solid var(--line);border-radius:14px;padding:13px;background:linear-gradient(180deg,#fff,#fafcfd);position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .stat.b::before{background:#3B97DD}.stat.g::before{background:var(--avail)}
  .stat .n{font-family:"Sora";font-size:1.5rem;font-weight:800;line-height:1;letter-spacing:-.02em}
  .stat .k{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:5px}

  .sec-title{font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800;margin:4px 0 10px}

  table.metrics{width:100%;border-collapse:collapse;font-size:.9rem}
  table.metrics tr{border-bottom:1px solid var(--line)}
  table.metrics tr:last-child{border-bottom:0}
  table.metrics td{padding:11px 4px}
  table.metrics td:first-child{color:var(--ink-soft);font-weight:600}
  table.metrics td:last-child{text-align:right;font-weight:800;font-family:"Sora";letter-spacing:-.01em}
  table.metrics .hi td:last-child{color:var(--accent)}

  .legend-block{margin-top:18px;border:1px dashed var(--line-strong);border-radius:14px;padding:14px}
  .legend-block .row{display:flex;flex-wrap:wrap;gap:10px 16px}

  /* active plot view */
  .pv-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .back{display:inline-flex;align-items:center;gap:6px;border:0;background:#eef2f6;color:var(--ink-soft);
    font:inherit;font-weight:700;font-size:.82rem;padding:8px 13px;border-radius:10px;cursor:pointer;transition:.15s}
  .back:hover{background:#e3e9ef;color:var(--ink)}
  .plotno{font-family:"Sora";font-size:2.3rem;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:14px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .badge{font-size:.76rem;font-weight:800;padding:6px 12px;border-radius:999px;border:1.5px solid}
  .badge.type-reg{background:#fff;border-color:var(--reg-bd);color:var(--ink-soft)}
  .badge.type-ews{background:var(--ews);border-color:var(--ews-bd);color:#1d6aa8}
  .badge.type-shop{background:var(--shop);border-color:var(--shop-bd);color:#b5701f}
  .badge.type-public{background:var(--public);border-color:var(--public-bd);color:#9a7c12}
  .badge.s-available{background:#e8faf0;border-color:var(--avail);color:#1e9c54}
  .badge.s-reserved{background:#fef3dd;border-color:var(--reserved);color:#b97c08}
  .badge.s-sold{background:#eef1f4;border-color:var(--sold);color:#6b7884}

  .pv-specs{margin-top:20px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .pv-specs .r{display:flex;justify-content:space-between;padding:12px 15px;font-size:.9rem}
  .pv-specs .r:nth-child(odd){background:#fafcfd}
  .pv-specs .r span{color:var(--ink-soft);font-weight:600}
  .pv-specs .r b{font-family:"Sora";font-weight:700}

  .cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:20px;
    border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:1rem;cursor:pointer;
    color:#0a2a23;background:linear-gradient(135deg,#FFD981,#E9B53F);
    box-shadow:0 14px 28px -12px rgba(201,162,75,.8);transition:.18s}
  .cta:hover{transform:translateY(-2px);box-shadow:0 18px 34px -12px rgba(201,162,75,.9)}
  .cta.sold{background:#eef1f4;color:#8a99a8;box-shadow:none;cursor:not-allowed}
  .cta svg{width:18px;height:18px}
  .pv-note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:11px;font-weight:600}

  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <span class="logo">R</span>
      <div>
        <h1>RMG Enterprisses — Layout Dashboard</h1>
        <p>Interactive plot map · Estd. 1983</p>
      </div>
    </div>
    <div class="crumbs">
      <span class="pill">Project · <b>Kannapalayam</b></span>
      <span class="pill">Poonamallee Panchayat Union</span>
    </div>
  </div>

  <div class="board">
    <!-- ============ LEFT : MAP ============ -->
    <div class="card map-panel">
      <div class="toolbar">
        <div class="tool-group">
          <span class="tool-label">Zoom</span>
          <button class="btn icon" id="zin"  title="Zoom in">＋</button>
          <button class="btn icon" id="zout" title="Zoom out">－</button>
          <button class="btn" id="zreset" title="Reset view">⟲ Reset</button>
        </div>
        <div class="tool-group">
          <span class="tool-label">Filter</span>
          <div class="seg" id="filter">
            <button data-f="all" class="active">Show All</button>
            <button data-f="avail">Available Only</button>
          </div>
        </div>
      </div>

      <div class="map-stage" id="stage">
        <svg id="map" viewBox="0 0 1240 1000" preserveAspectRatio="xMidYMid meet" aria-label="Interactive plot layout map">
          <g id="viewport"></g>
        </svg>
        <div class="tip" id="tip"></div>
      </div>

      <div class="map-legend">
        <span class="lg"><span class="sw" style="background:var(--reg);border-color:var(--reg-bd)"></span>Residential</span>
        <span class="lg"><span class="sw" style="background:var(--ews);border-color:var(--ews-bd)"></span>EWS</span>
        <span class="lg"><span class="sw" style="background:var(--park);border-color:var(--park-bd)"></span>Park</span>
        <span class="lg"><span class="sw" style="background:var(--shop);border-color:var(--shop-bd)"></span>Shop / Public</span>
        <span class="lg"><span class="sw" style="background:#fff;border-color:var(--avail)"></span>Available</span>
        <span class="lg"><span class="sw" style="background:#fff;border-color:var(--reserved)"></span>Reserved</span>
        <span class="lg"><span class="sw" style="background:#EEF1F4;border-color:var(--sold)"></span>Sold</span>
      </div>
    </div>

    <!-- ============ RIGHT : SIDEBAR ============ -->
    <div class="card side">
      <div class="side-head">
        <div class="ey">RMG Enterprisses Layout</div>
        <h2 id="sideTitle">Project Overview</h2>
        <div class="loc">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Kannapalayam Village · Poonamallee Panchayat Union
        </div>
      </div>
      <div class="side-pad" id="sideBody"><!-- rendered by JS --></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const NS="http://www.w3.org/2000/svg";
  const viewport=document.getElementById('viewport');
  const svg=document.getElementById('map');
  const tip=document.getElementById('tip');
  const stage=document.getElementById('stage');
  const sideBody=document.getElementById('sideBody');
  const sideTitle=document.getElementById('sideTitle');

  /* ---------- geometry: 3×3 slot grid with roads in the gaps ---------- */
  const VB_W=1240, VB_H=1000, M=70, ROAD=52;
  const slotW=(VB_W-2*M-2*ROAD)/3;   // 332
  const slotH=(VB_H-2*M-2*ROAD)/3;   // 252
  const sx=c=>M+c*(slotW+ROAD);
  const sy=r=>M+r*(slotH+ROAD);

  // slot plan — regular blocks total 246, EWS total 108
  const SLOTS=[
    {c:0,r:0,kind:'reg', cols:9,rows:6,label:'Block A'},  // 54
    {c:1,r:0,kind:'park',label:'Central Park'},
    {c:2,r:0,kind:'reg', cols:9,rows:6,label:'Block B'},  // 54
    {c:0,r:1,kind:'reg', cols:8,rows:6,label:'Block C'},  // 48
    {c:1,r:1,kind:'center'},                              // shops + public + park
    {c:2,r:1,kind:'reg', cols:9,rows:5,label:'Block D'},  // 45
    {c:0,r:2,kind:'ews', cols:9,rows:6,label:'EWS Block 1'},// 54
    {c:1,r:2,kind:'reg', cols:9,rows:5,label:'Block E'},  // 45
    {c:2,r:2,kind:'ews', cols:9,rows:6,label:'EWS Block 2'},// 54
  ];

  const PLOTS={};         // id -> data
  function statusFor(id){const m=(id*37)%100; return m<58?'available':(m<82?'sold':'reserved');}
  function areaFor(type,id){return type==='ews' ? 80+(id*7)%26 : 150+(id*11)%70;}

  let regN=1, ewsN=247;
  const parts=[];   // svg markup pieces

  /* roads first (so blocks read as bounded by them) */
  function road(){
    const out=[`<rect class="road" x="${M-12}" y="${M-12}" width="${VB_W-2*M+24}" height="${VB_H-2*M+24}" rx="14" opacity=".55"/>`];
    // vertical road bands
    [sx(1)-ROAD, sx(2)-ROAD].forEach(x=>{
      out.push(`<rect class="road" x="${x}" y="${M-12}" width="${ROAD}" height="${VB_H-2*M+24}"/>`);
      out.push(`<line class="road-line" x1="${x+ROAD/2}" y1="${M-4}" x2="${x+ROAD/2}" y2="${VB_H-M+4}"/>`);
    });
    // horizontal road bands
    [sy(1)-ROAD, sy(2)-ROAD].forEach(y=>{
      out.push(`<rect class="road" x="${M-12}" y="${y}" width="${VB_W-2*M+24}" height="${ROAD}"/>`);
      out.push(`<line class="road-line" x1="${M-4}" y1="${y+ROAD/2}" x2="${VB_W-M+4}" y2="${y+ROAD/2}"/>`);
    });
    // entry marker (bottom of left vertical road)
    out.push(`<text class="lbl" x="${sx(1)-ROAD/2}" y="${VB_H-M+34}" text-anchor="middle" font-size="13">▼ Main Entry</text>`);
    return out.join('');
  }

  function blockOfPlots(s,type){
    const gap=4;
    const cw=(slotW-(s.cols-1)*gap)/s.cols;
    const ch=(slotH-(s.rows-1)*gap)/s.rows;
    const x0=sx(s.c), y0=sy(s.r);
    let out=`<text class="lbl" x="${x0}" y="${y0-7}" font-size="12">${s.label}</text>`;
    for(let r=0;r<s.rows;r++){
      for(let c=0;c<s.cols;c++){
        const id = type==='ews' ? ewsN++ : regN++;
        const st = statusFor(id);
        const px=x0+c*(cw+gap), py=y0+r*(ch+gap);
        PLOTS[id]={id,type,status:st,area:areaFor(type,id),block:s.label,
                   dim:`${type==='ews'?'6×9':'9×12'} m`};
        out+=`<rect class="plot ${type} st-${st}" data-id="${id}" x="${px.toFixed(1)}" y="${py.toFixed(1)}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}" rx="2.5"/>`;
      }
    }
    return out;
  }

  function park(s){
    const x=sx(s.c),y=sy(s.r);
    let out=`<rect class="zone park" data-zone="park" data-label="${s.label}" x="${x}" y="${y}" width="${slotW}" height="${slotH}" rx="10"/>`;
    out+=`<text class="zlbl" x="${x+slotW/2}" y="${y+slotH/2-4}" font-size="15" fill="#4e9c6b">${s.label}</text>`;
    out+=`<text class="zlbl" x="${x+slotW/2}" y="${y+slotH/2+16}" font-size="11" fill="#79b894">Green / Open Space</text>`;
    // little trees
    [[40,40],[slotW-46,52],[60,slotH-44],[slotW-60,slotH-40]].forEach(p=>{
      out+=`<circle class="tree" cx="${x+p[0]}" cy="${y+p[1]}" r="13"/>`;
    });
    return out;
  }

  function center(s){
    const x=sx(s.c),y=sy(s.r),w=slotW,h=slotH,p=10;
    const halfW=(w-3*p)/2;
    let out='';
    // public purpose (yellow)
    out+=`<rect class="zone public" data-zone="public" data-label="Public Purpose Site" x="${x+p}" y="${y+p}" width="${w-2*p}" height="62" rx="8"/>`;
    out+=`<text class="zlbl" x="${x+w/2}" y="${y+p+38}" font-size="13" fill="#9a7c12">Public Purpose</text>`;
    // two shop sites (orange)
    out+=`<rect class="zone shop" data-zone="shop" data-label="Shop Site 1" x="${x+p}" y="${y+p+72}" width="${halfW}" height="56" rx="8"/>`;
    out+=`<rect class="zone shop" data-zone="shop" data-label="Shop Site 2" x="${x+2*p+halfW}" y="${y+p+72}" width="${halfW}" height="56" rx="8"/>`;
    out+=`<text class="zlbl" x="${x+p+halfW/2}" y="${y+p+105}" font-size="11" fill="#b5701f">Shop 1</text>`;
    out+=`<text class="zlbl" x="${x+2*p+halfW*1.5}" y="${y+p+105}" font-size="11" fill="#b5701f">Shop 2</text>`;
    // convenience shops
    out+=`<rect class="zone shop" data-zone="shop" data-label="Convenience Shop 1" x="${x+p}" y="${y+p+136}" width="${halfW}" height="42" rx="8" opacity=".92"/>`;
    out+=`<rect class="zone shop" data-zone="shop" data-label="Convenience Shop 2" x="${x+2*p+halfW}" y="${y+p+136}" width="${halfW}" height="42" rx="8" opacity=".92"/>`;
    out+=`<text class="zlbl" x="${x+p+halfW/2}" y="${y+p+162}" font-size="10" fill="#b5701f">Conv. 1</text>`;
    out+=`<text class="zlbl" x="${x+2*p+halfW*1.5}" y="${y+p+162}" font-size="10" fill="#b5701f">Conv. 2</text>`;
    // small green
    out+=`<rect class="zone park" data-zone="park" data-label="Pocket Park" x="${x+p}" y="${y+p+188}" width="${w-2*p}" height="${h-p-198}" rx="8"/>`;
    out+=`<text class="zlbl" x="${x+w/2}" y="${y+h-12}" font-size="11" fill="#4e9c6b">Pocket Park</text>`;
    return out;
  }

  function compass(){
    const cx=VB_W-M-6, cy=M+8;
    return `<g class="compass" transform="translate(${cx},${cy})">
      <circle r="22" fill="#fff" stroke="#E3E9EF"/>
      <path d="M0,-15 L6,4 L0,-1 L-6,4 Z" fill="#0E7C66"/>
      <text x="0" y="-24" text-anchor="middle" font-size="10" font-weight="800" fill="#2C3E50">N</text>
    </g>`;
  }

  /* assemble */
  let markup=road();
  SLOTS.forEach(s=>{
    if(s.kind==='reg')   markup+=blockOfPlots(s,'regular');
    else if(s.kind==='ews') markup+=blockOfPlots(s,'ews');
    else if(s.kind==='park') markup+=park(s);
    else if(s.kind==='center') markup+=center(s);
  });
  markup+=compass();
  viewport.innerHTML=markup;

  /* counts */
  const all=Object.values(PLOTS);
  const availCount=all.filter(p=>p.status==='available').length;
  const soldCount=all.filter(p=>p.status==='sold').length;
  const resCount=all.filter(p=>p.status==='reserved').length;

  /* ---------------- sidebar rendering ---------------- */
  const fmt=n=>n.toLocaleString('en-IN');
  function renderOverview(){
    sideTitle.textContent='Project Overview';
    sideBody.className='side-pad fade';
    sideBody.innerHTML=`
      <div class="stat-grid">
        <div class="stat g"><div class="n">${availCount}</div><div class="k">Available</div></div>
        <div class="stat"><div class="n">354</div><div class="k">Total Plots</div></div>
        <div class="stat b"><div class="n">108</div><div class="k">EWS Plots</div></div>
      </div>
      <div class="sec-title">Project Metrics</div>
      <table class="metrics">
        <tr><td>Total Extent</td><td>103,719 m²</td></tr>
        <tr><td>Road Area</td><td>26,694 m²</td></tr>
        <tr><td>Park Area</td><td>7,942 m²</td></tr>
        <tr><td>Public Purpose Plots</td><td>7,930 m²</td></tr>
        <tr class="hi"><td>Regular Plots</td><td>246 · (1–246)</td></tr>
        <tr class="hi"><td>EWS Plots</td><td>108 · (247–354)</td></tr>
        <tr><td>Shop Sites</td><td>2</td></tr>
        <tr><td>Convenience Shop Sites</td><td>2</td></tr>
        <tr class="hi"><td>Total Plots</td><td>354</td></tr>
      </table>
      <div class="legend-block">
        <div class="sec-title" style="margin:0 0 10px">Availability</div>
        <div class="row">
          <span class="lg"><span class="sw" style="background:#fff;border-color:var(--avail)"></span>Available · ${availCount}</span>
          <span class="lg"><span class="sw" style="background:#fef3dd;border-color:var(--reserved)"></span>Reserved · ${resCount}</span>
          <span class="lg"><span class="sw" style="background:#EEF1F4;border-color:var(--sold)"></span>Sold · ${soldCount}</span>
        </div>
      </div>
      <p class="pv-note">Tip: click any plot on the map to see its details.</p>`;
  }

  function renderPlot(p){
    sideTitle.textContent='Plot Details';
    const typeLabel = p.type==='ews' ? 'EWS Residential' : 'Regular Residential';
    const stLabel = p.status.charAt(0).toUpperCase()+p.status.slice(1);
    const wa=`https://wa.me/919444343402?text=${encodeURIComponent('Hi RMG Enterprisses, I am interested in Plot #'+p.id+' ('+typeLabel+') at the Kannapalayam layout. Please share details.')}`;
    const soldOut = p.status==='sold';
    sideBody.className='side-pad fade';
    sideBody.innerHTML=`
      <div class="pv-top">
        <button class="back" id="back">← Back to Overview</button>
        <span class="badge type-${p.type==='ews'?'ews':'reg'}">${p.type==='ews'?'EWS':'Residential'}</span>
      </div>
      <div class="plotno">Plot #${p.id}</div>
      <div class="badges">
        <span class="badge s-${p.status}">${stLabel}</span>
        <span class="badge type-${p.type==='ews'?'ews':'reg'}">${typeLabel}</span>
      </div>
      <div class="pv-specs">
        <div class="r"><span>Plot Number</span><b>#${p.id}</b></div>
        <div class="r"><span>Category</span><b>${typeLabel}</b></div>
        <div class="r"><span>Block</span><b>${p.block}</b></div>
        <div class="r"><span>Approx. Extent</span><b>${p.area} m²</b></div>
        <div class="r"><span>Dimensions</span><b>${p.dim}</b></div>
        <div class="r"><span>Status</span><b style="color:${p.status==='available'?'#1e9c54':p.status==='reserved'?'#b97c08':'#6b7884'}">${stLabel}</b></div>
      </div>
      ${ soldOut
        ? `<button class="cta sold" disabled>Already Sold</button>`
        : `<a class="cta" href="${wa}" target="_blank" rel="noopener">
             <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.21c5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2z"/></svg>
             Book Plot #${p.id}
           </a>`}
      <p class="pv-note">${soldOut?'This plot is no longer available.':'Enquiry opens WhatsApp · 94443 43402'}</p>`;
    document.getElementById('back').addEventListener('click',()=>{clearSel();renderOverview();});
  }

  /* ---------------- interactions ---------------- */
  let selectedEl=null;
  function clearSel(){ if(selectedEl){selectedEl.classList.remove('selected');selectedEl=null;} }

  svg.addEventListener('click',e=>{
    const plotEl=e.target.closest('.plot');
    if(plotEl){
      clearSel(); selectedEl=plotEl; plotEl.classList.add('selected');
      renderPlot(PLOTS[plotEl.dataset.id]); return;
    }
    const zone=e.target.closest('.zone');
    if(zone){
      clearSel(); selectedEl=zone; zone.classList.add('selected');
      sideTitle.textContent='Common Area';
      sideBody.className='side-pad fade';
      const isPark=zone.dataset.zone==='park';
      sideBody.innerHTML=`
        <div class="pv-top"><button class="back" id="back">← Back to Overview</button>
          <span class="badge type-${isPark?'reg':'shop'}">${isPark?'Green Space':'Commercial'}</span></div>
        <div class="plotno" style="font-size:1.7rem">${zone.dataset.label}</div>
        <div class="badges"><span class="badge type-${isPark?'reg':'public'}">Common / Public Amenity</span></div>
        <p style="margin-top:18px;color:var(--ink-soft);line-height:1.6;font-size:.92rem">
          ${isPark?'A dedicated green / open space reserved within the layout for residents — landscaping, walking and play area.'
                  :'A reserved commercial / public-purpose site within the layout, planned for shops and community convenience.'}</p>
        <p class="pv-note" style="margin-top:18px">Part of the approved Kannapalayam layout plan.</p>`;
      document.getElementById('back').addEventListener('click',()=>{clearSel();renderOverview();});
    }
  });

  /* tooltip */
  svg.addEventListener('mousemove',e=>{
    const el=e.target.closest('.plot');
    if(el){
      const p=PLOTS[el.dataset.id];
      tip.innerHTML=`Plot <b>#${p.id}</b> · ${p.status}`;
      const r=stage.getBoundingClientRect();
      tip.style.left=(e.clientX-r.left)+'px';
      tip.style.top=(e.clientY-r.top)+'px';
      tip.classList.add('show');
    } else tip.classList.remove('show');
  });
  svg.addEventListener('mouseleave',()=>tip.classList.remove('show'));

  /* ---------------- zoom & pan ---------------- */
  let scale=1, tx=0, ty=0;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function apply(){ viewport.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`); }
  function toVB(clientX,clientY){
    const pt=svg.createSVGPoint(); pt.x=clientX; pt.y=clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function zoomTo(ns,px,py){
    ns=clamp(ns,.6,4);
    const wx=(px-tx)/scale, wy=(py-ty)/scale;
    tx=px-wx*ns; ty=py-wy*ns; scale=ns; apply();
  }
  document.getElementById('zin').onclick =()=>zoomTo(scale*1.25,VB_W/2,VB_H/2);
  document.getElementById('zout').onclick=()=>zoomTo(scale/1.25,VB_W/2,VB_H/2);
  document.getElementById('zreset').onclick=()=>{scale=1;tx=0;ty=0;apply();};
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const p=toVB(e.clientX,e.clientY);
    zoomTo(scale*(e.deltaY<0?1.12:1/1.12),p.x,p.y);
  },{passive:false});

  // drag to pan (only when starting on empty space / roads)
  let panning=false,start=null,tx0=0,ty0=0;
  svg.addEventListener('pointerdown',e=>{
    if(e.target.closest('.plot')||e.target.closest('.zone')) return;
    panning=true; svg.classList.add('grabbing'); svg.setPointerCapture(e.pointerId);
    start=toVB(e.clientX,e.clientY); tx0=tx; ty0=ty;
  });
  svg.addEventListener('pointermove',e=>{
    if(!panning) return;
    const cur=toVB(e.clientX,e.clientY);
    tx=tx0+(cur.x-start.x); ty=ty0+(cur.y-start.y); apply();
  });
  function endPan(e){ if(panning){panning=false;svg.classList.remove('grabbing'); if(e&&e.pointerId!=null){try{svg.releasePointerCapture(e.pointerId);}catch(_){}}} }
  svg.addEventListener('pointerup',endPan);
  svg.addEventListener('pointercancel',endPan);

  /* ---------------- filter ---------------- */
  document.getElementById('filter').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    [...e.currentTarget.children].forEach(x=>x.classList.toggle('active',x===b));
    svg.classList.toggle('only-avail', b.dataset.f==='avail');
  });

  renderOverview();
})();
</script>
</body>
</html>
